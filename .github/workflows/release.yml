name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Tag matches package.json and server.json versions
        run: |
          node -e '
            const v = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            const pkg = require("./package.json");
            const srv = require("./server.json");
            const versions = [pkg.version, srv.version, ...srv.packages.map((p) => p.version)];
            if (versions.some((x) => x !== v)) {
              console.error(`tag ${v}, package.json ${pkg.version}, server.json ${versions.slice(1).join(", ")}`);
              process.exit(1);
            }'
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\[?" v "\\]?" {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --generate-notes
